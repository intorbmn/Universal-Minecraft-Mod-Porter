[package]
name = "ummp"
version = "0.1.0"
edition = "2021"
description = "Universal Minecraft Mod Porter — CLI"
license = "MIT"

[dependencies]
ummp-core = { path = "../core" }
ummp-ai-providers = { path = "../providers" }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[lints]
workspace = true