# Build templates for loader conversion (Phase 9, ADR 0012). Read by `adapter/loader.rs`.
# Keyed by (loader, minecraft). Versions come from the official templates:
#   NeoForge: NeoForgeMDKs/MDK-1.21.1-ModDevGradle (moddev 2.0.148, neo 21.1.267, Gradle 9.2.1)
#   Fabric:   FabricMC/fabric-example-mod branch 1.21 (fabric-loom-remap 1.19-SNAPSHOT,
#             loader 0.20.1, Gradle 9.8.2)
# Placeholders: @MOD_ID@ @VERSION@ @GROUP@ @USER_DEPS@ @ACCESS@
# Adding a version = adding a [[template]] row.

[[template]]
loader = "neoforge"
minecraft = "1.21.1"
gradle = "9.2.1"
settings_gradle = '''
pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = '@MOD_ID@'
'''
gradle_properties = '''
# Generated by UMMP from the NeoForge 1.21.1 MDK.
org.gradle.jvmargs=-Xmx2G
minecraft_version=1.21.1
neo_version=21.1.267
mod_id=@MOD_ID@
mod_version=@VERSION@
mod_group_id=@GROUP@
'''
build_gradle = '''
// Generated by UMMP from the NeoForge 1.21.1 MDK (ModDevGradle).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
@USER_DEPS@
}

jar {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
'''

[[template]]
loader = "fabric"
minecraft = "1.21.1"
gradle = "9.8.2"
settings_gradle = '''
pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = '@MOD_ID@'
'''
gradle_properties = '''
# Generated by UMMP from the Fabric example mod.
org.gradle.jvmargs=-Xmx2G
minecraft_version=1.21.1
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
mod_version=@VERSION@
maven_group=@GROUP@
archives_base_name=@MOD_ID@
'''
build_gradle = '''
// Generated by UMMP from the Fabric example mod (Loom, Mojang mappings).
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
@USER_DEPS@
}
@ACCESS@
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
'''
