[package]
name = "ummp-server"
version = "0.1.0"
edition = "2021"
description = "Local REST API for Universal Minecraft Mod Porter"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
ummp-core = { path = "../core" }
ummp-ai-providers = { path = "../providers" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
